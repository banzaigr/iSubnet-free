name: iOS compile check (feature branch)

on:
  push:
    branches:
      - feature/ping-traceroute

jobs:
  compile:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: node --version

      - run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor project
        run: npx cap sync ios

      - name: Build iOS project (unsigned compile check)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
